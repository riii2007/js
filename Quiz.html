<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                background-color: #f0f0f0;
            }
            #quiz-box {
                background-color: white;
                padding: 20px;
                border-radius: 10px;
                box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
                text-align: center;
            }
            .option-btn {
                display: block;
                width: 100%;
                margin: 10px 0;
                padding: 10px;
                font-size: 16px;
                cursor: pointer;
            }
            #result {
                margin-top: 20px;
                font-size: 18px;
            }
</style>
</head>
<body>
    <div id="quiz-box">
    <h2 id="question"></h2>
    <button id="option1" class="option-btn"></button>
    <button id="option2" class="option-btn"></button>
    <button id="option3" class="option-btn"></button>
    <button id="option4" class="option-btn"></button>
    <div id="result"></div>
    </div>
    <script src="Quiz.js"></script>
</body>
</html>
