<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: rgba(0, 0, 0, 0.522);
        }
        #slider img{
          width: 100%;
          height: 100%;

        }
        #slider{
            width: 800px;
            height: 500px;
            border: 1px solid black;
            margin-top: 20px;
            display: block;
            margin-left: auto;
            margin-right: auto;

        }
         #start{ 
                margin-bottom: 10px;
                padding: 10px 20px;
                font-size: 20px;
                background-color: lightskyblue;
                cursor: pointer;
                border: none;
                border-radius: 10px;
         }
         #start:hover{
                    background-color: deepskyblue;

         }
         h1{
            font-family: Arial, sans-serif;
            color: white;
            text-align: center;
            margin-top: 20px;
         }
         button{
            display: block;
            margin: 0 auto;  
            justify-content: center;
            
         }

         
    </style>
</head>
<body>
    <h1 >Image Slider</h1>
    <div id="loading" style="display:none">
        <h1>welcome</h1>
    </div>
     <button id="start">Start</button>
    <div id="slider"></div>
    <script src="slider.js"></script>
</body>
</html>
